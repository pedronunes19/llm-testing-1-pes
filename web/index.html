<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe PES 2019</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #loading {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: #ccc; font-family: system-ui; font-size: 1.4rem;
        }
    </style>
</head>
<body>
    <div id="loading">Loading…</div>
    <canvas id="game-canvas" tabindex="0" style="outline: none;"></canvas>
    <script type="module">
        import init from './pkg/vibe-pes2019.js';

        function setupCanvas() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
            const canvas = document.getElementById('game-canvas');
            if (canvas) {
                canvas.focus();
                window.addEventListener('click', () => canvas.focus());
            }
        }

        init()
            .then(setupCanvas)
            .catch(e => {
                const errStr = String(e || '');
                // Winit intentionally throws this to unwind the stack on web
                if (errStr.includes('control flow') || errStr.includes("isn't an error")) {
                    setupCanvas();
                    return;
                }
                console.error('Fatal game error:', e);
                const loading = document.getElementById('loading');
                if (loading) loading.remove();
            });
    </script>
</body>
</html>
